name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (pytest + frontend build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend deps
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Lint
        working-directory: backend
        run: ruff check .

      - name: Run tests
        working-directory: backend
        run: pytest -v

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build

  build-scan-push:
    name: Build, scan, push (${{ matrix.service }})
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v7

      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/stockroom-${{ matrix.service }}:${{ github.sha }}" >> "$GITHUB_ENV"

      - name: Build image
        run: |
          docker build \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            -t "$IMAGE" ./${{ matrix.service }}

      # Pinned to a commit SHA, not a tag, so a moved tag can't swap the code under us.
      - name: Trivy scan (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          image-ref: ${{ env.IMAGE }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name == 'push'
        run: docker push "$IMAGE"

  deploy:
    name: Deploy (bump Helm tag for ArgoCD)
    needs: build-scan-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Point Helm values at the new images
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          sed -i \
            -e "s|repository: ghcr.io/.*/stockroom-backend|repository: ghcr.io/$OWNER/stockroom-backend|" \
            -e "s|repository: ghcr.io/.*/stockroom-frontend|repository: ghcr.io/$OWNER/stockroom-frontend|" \
            -e "s|^    tag: .*|    tag: ${{ github.sha }}|" \
            helm/stockroom/values.yaml
          git diff --stat

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy: stockroom ${GITHUB_SHA::7} [skip ci]" || { echo "nothing to change"; exit 0; }
          git pull --rebase origin main
          git push origin HEAD:main
