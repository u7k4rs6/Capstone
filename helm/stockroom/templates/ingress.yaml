{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  labels: {{- include "stockroom.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - {{- with .Values.ingress.host }}
      host: {{ . }}
      {{- end }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: {name: {{ .Release.Name }}-backend, port: {number: 8000}}
          - path: /
            pathType: Prefix
            backend:
              service: {name: {{ .Release.Name }}-frontend, port: {number: 80}}
{{- end }}
