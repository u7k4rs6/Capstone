# Image tags below are bumped by CI on every push to main. ArgoCD picks up the commit and syncs.
backend:
  image:
    repository: ghcr.io/u7k4rs6/stockroom-backend
    tag: 37fa59e86cb4c8a61cf67037792c2a4ac15a908b
  replicas: 2
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 500m, memory: 384Mi}

frontend:
  image:
    repository: ghcr.io/u7k4rs6/stockroom-frontend
    tag: 37fa59e86cb4c8a61cf67037792c2a4ac15a908b
  replicas: 2
  resources:
    requests: {cpu: 25m, memory: 32Mi}
    limits: {cpu: 200m, memory: 128Mi}

imagePullSecrets: []

postgres:
  image: postgres:17-alpine
  database: stockroom
  username: stockroom
  # No default on purpose: the chart refuses to install without one.
  # bootstrap-cluster.sh generates it and hands it to ArgoCD. Real prod would use External Secrets or RDS.
  password: ""
  storage: 2Gi
  storageClass: ""

ingress:
  enabled: true
  className: nginx
  # Empty host matches any hostname, handy when you only have the load balancer DNS name.
  host: ""

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 60

monitoring:
  serviceMonitor:
    enabled: true
    interval: 15s
  grafanaDashboard:
    enabled: true
