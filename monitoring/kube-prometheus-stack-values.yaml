# helm install kube-prometheus-stack prometheus-community/kube-prometheus-stack -n monitoring -f this-file
alertmanager:
  enabled: false

prometheus:
  prometheusSpec:
    # Scrape every ServiceMonitor in every namespace, not just ones labelled for this release.
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorNamespaceSelector: {}
    retention: 2d
    resources:
      requests: {cpu: 100m, memory: 512Mi}

grafana:
  enabled: true
  # adminPassword is passed by bootstrap-cluster.sh, never stored in git.
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      searchNamespace: ALL

# EKS (and kind) don't expose control-plane metrics to workloads. Turning these off avoids red DOWN targets.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false
